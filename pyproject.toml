[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-sealer"
version = "0.1.0"
description = "A machine-bound, time-limited prompt encryption CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "cryptography>=44",
    "pywin32>=306; sys_platform == 'win32'"
]

[project.scripts]
prompt-sealer = "prompt_sealer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]